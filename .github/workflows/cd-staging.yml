# ── OpsIQ — CD Staging Auto-Deploy ──────────────────────────
# Deploys to staging on push to main, runs DR checks, then optional prod deploy
name: CD Staging Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'
        type: boolean
      deploy_prod:
        description: 'Also deploy to production'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build & Test ─────────────────────────────────────────
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio ruff mypy

      - name: Run linting
        run: ruff check ecommerce_ops/ --output-format=github

      - name: Run type checking
        run: mypy ecommerce_ops/ --ignore-missing-imports || true  # soft fail on type errors

      - name: Run unit tests
        run: pytest tests/ -x -q --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  # ── Build Docker Image ───────────────────────────────────
  build-image:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      cache-key: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Staging ────────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-image
    environment: staging
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      API_IMAGE: ${{ needs.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging
        run: |
          ssh -i ~/.ssh/staging_key deploy@${{ secrets.STAGING_HOST }} << EOF
            cd /opt/opsiq
            git pull origin main

            # Pull and run the exact image built by CI
            IMAGE="$API_IMAGE"
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull api
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d api

            # Verify the correct tag is running
            RUNNING_IMG=\$(docker inspect --format='{{.Config.Image}}' opsiq-api-staging 2>/dev/null || echo '')
            echo "Running API image: \$RUNNING_IMG (expected \$IMAGE)"

            # Wait for health
            for i in \$(seq 1 30); do
              if curl -sf http://localhost:8100/health > /dev/null 2>&1; then
                echo "Staging API healthy"
                exit 0
              fi
              sleep 2
            done
            echo "Staging API failed to become healthy"
            exit 1
          EOF

      - name: Run smoke tests
        env:
          API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          ssh -i ~/.ssh/staging_key deploy@${{ secrets.STAGING_HOST }} << EOF
            # Health check
            curl -sf http://localhost:8100/health || exit 1

            # API versioning — /api/agents/status is the correct endpoint
            STATUS=\$(curl -sf -w "%{http_code}" -o /dev/null http://localhost:8100/api/agents/status \
              -H "X-API-Key: \$API_KEY")
            if [[ "\$STATUS" != "200" ]]; then
              echo "Smoke test failed: /api/agents/status returned \$STATUS"
              exit 1
            fi

            # Database connectivity
            docker exec opsiq-postgres-staging pg_isready -U postgres

            echo "All smoke tests passed"
          EOF

      - name: Run backup verification
        run: |
          ssh -i ~/.ssh/staging_key deploy@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/opsiq
            bash scripts/backup-db.sh
            bash scripts/verify-backup.sh
          EOF

      - name: Run DR check
        run: |
          ssh -i ~/.ssh/staging_key deploy@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/opsiq
            bash scripts/disaster-recovery.sh check
          EOF

  # ── Deploy to Production (manual trigger) ────────────────
  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging, build-image]
    if: github.event.inputs.deploy_prod == 'true'
    environment: production
    env:
      API_IMAGE: ${{ needs.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Pre-deploy backup
        run: |
          ssh -i ~/.ssh/prod_key deploy@${{ secrets.PROD_HOST }} << 'EOF'
            cd /opt/opsiq
            bash scripts/backup-db.sh
          EOF

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/prod_key deploy@${{ secrets.PROD_HOST }} << EOF
            cd /opt/opsiq
            git pull origin main
            API_IMAGE="$API_IMAGE" bash scripts/deploy.sh up
          EOF

      - name: Post-deploy verification
        run: |
          ssh -i ~/.ssh/prod_key deploy@${{ secrets.PROD_HOST }} << 'EOF'
            cd /opt/opsiq
            # Health check with timeout
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "Production API healthy"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Production API failed health check"
                exit 1
              fi
              sleep 2
            done

            # Database verification
            docker exec opsiq-postgres pg_isready -U postgres || exit 1

            # Disaster recovery check
            bash scripts/disaster-recovery.sh check || exit 1

            # Backup verification
            bash scripts/verify-backup.sh || exit 1
          EOF

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/prod_key deploy@${{ secrets.PROD_HOST }} << 'EOF'
            cd /opt/opsiq
            echo "Rolling back to last known good image..."
            bash scripts/deploy.sh rollback || exit 1
          EOF
