# ── Secret Scanning ───────────────────────────────────────────
# Defence-in-depth: blocks accidental commits of secrets.
# Complements (does not replace) GitHub native Secret Scanning /
# Push Protection, which should also be enabled in repo settings.
name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the complete diff/history.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  re-verify:
    name: Secret Re-verification (post-rotation checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .env must never be tracked; this job fails the push if it is.
      - name: Verify .env files are untracked
        run: |
          TRACKED_ENV=$(git ls-files | grep -E '(^|/)\.env(\.|$)' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "::error::Tracked .env file(s) found: $TRACKED_ENV"
            exit 1
          fi
          echo "✓ No .env files tracked"

      - name: Full-history secret re-verification
        run: bash scripts/verify-secrets.sh --ci
