global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'opsiq-prod'

rule_files:
  - '/etc/prometheus/rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

- job_name: 'opsiq-backend'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scheme: 'http'
    # /metrics is auth-gated outside development; Prometheus (busybox image,
    # no envsubst) authenticates using a bearer token written by
    # prometheus-entrypoint.sh from the API_KEY env var.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape_token

  - job_name: 'opsiq-frontend'
    static_configs:
      - targets: ['dashboard:3000']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
