# ── OpsIQ — Production Docker Compose ──────────────────────
# Usage:
#   Development: docker compose up (auto-merges override)
#   Production:  docker compose -f docker-compose.yml up -d
#   With backup: docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d
#
# Requires a `.env` file with production secrets (see .env.production).

services:
  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: opsiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_ops}
    # No host port published — reachable only on the internal network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: opsiq-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce_ops}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: opsiq-redis
    # No host port published — reachable only on the internal network.
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: opsiq-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  # ── Backend API ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsiq-api
    env_file:
      - .env
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn ecommerce_ops.api.app:app --host 0.0.0.0 --port 8000 --workers 4 --timeout-graceful-shutdown 30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/ready'); r.read(); exit(0) if r.status==200 else exit(1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Frontend Dashboard ────────────────────────────────────
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opsiq-dashboard
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/queue
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ── Reverse Proxy ─────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: opsiq-nginx:latest
    container_name: opsiq-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - dashboard

  # ── Observability ─────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: opsiq-node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    network_mode: host
    volumes:
      - '/:/host:ro,rslave'
    profiles: ["observability"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: opsiq-cadvisor
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:ro'
      - '/sys:/sys:ro'
      - '/var/lib/docker/:/var/lib/docker:ro'
      - '/dev/disk/:/dev/disk:ro'
    ports:
      - "8080:8080"
    devices:
      - "/dev/kmsg:/dev/kmsg"
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: opsiq-prometheus
    env_file:
      - .env
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - ./monitoring/prometheus-entrypoint.sh:/prometheus-entrypoint.sh:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "/prometheus-entrypoint.sh"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      - api

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: opsiq-alertmanager
    env_file:
      - .env
    volumes:
      - ./monitoring/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./monitoring/alertmanager-entrypoint.sh:/alertmanager-entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    entrypoint: ["/bin/sh", "/alertmanager-entrypoint.sh"]
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.0.0
    container_name: opsiq-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Fail-closed in production: deploy.sh / .env.production must set GRAFANA_ADMIN_PASSWORD.
      # No default here (and never the insecure "admin" fallback); demo/staging/override
      # compose files override it explicitly.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # ── Distributed Tracing ───────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    container_name: opsiq-tempo
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "4317:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: opsiq-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel/otelcol.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  tempo_data:
  nginx_logs:
  audit_logs: