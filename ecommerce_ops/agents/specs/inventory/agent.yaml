agent_id: inventory
display_name: Inventory Management
description: LLM-powered demand forecasting and automated reorder with rule-based fallback
llm_class: ecommerce_ops.agents.inventory_llm.InventoryManagementAgentLLM
llm_method: analyze
rule_class: ecommerce_ops.agents.inventory.InventoryAgent
rule_method: run
input_adapter: ecommerce_ops.agents.inventory_adapters.adapt_input
output_adapter: ecommerce_ops.agents.inventory_adapters.adapt_output
slo_p95_latency_ms: 5000.0
slo_min_success_rate: 0.95
state_keys:
  - inventory_data
  - active_orders
