agent_id: fraud
display_name: Fraud Detection
description: LLM-powered order risk assessment with rule-based fallback
llm_class: ecommerce_ops.agents.fraud_llm.FraudDetectionAgentLLM
llm_method: analyze
rule_class: ecommerce_ops.agents.fraud.FraudAgent
rule_method: run
input_adapter: ecommerce_ops.agents.fraud_adapters.adapt_input
output_adapter: ecommerce_ops.agents.fraud_adapters.adapt_output
slo_p95_latency_ms: 5000.0
slo_min_success_rate: 0.95
state_keys:
  - active_orders
